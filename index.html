<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Arsip PKL — Ahmad Rijani</title>

  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #151a20;
      --line: #252c34;
      --text: #eef2f6;
      --muted: #9aa4af;
      --accent: #ffffff;
      --shadow: 0 12px 30px rgba(0,0,0,.25);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #151a20 0,
          var(--bg) 38%,
          #080a0d 100%
        );
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    header {
      margin-bottom: 26px;
    }

    h1 {
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      letter-spacing: -.025em;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .82rem;
    }

    .section {
      margin-top: 28px;
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .section-title {
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-size: 1.05rem;
      margin: 0;
    }

    .section-title span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-top: 2px;
    }

    .grid {
      display: grid;
      gap: 9px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      transition:
        border-color .2s ease,
        transform .2s ease,
        background .2s ease;
    }

    .card:hover {
      border-color: #3a444f;
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    .thumb-link {
      flex: 0 0 132px;
    }

    .thumb-wrap {
      position: relative;
      width: 132px;
      aspect-ratio: 16 / 9;
      background: #0a0c0f;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1d232a;
    }

    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-thumb {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .9rem;
    }

    .play {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.16);
      font-size: .72rem;
    }

    .content {
      min-width: 0;
      flex: 1;
      padding: 2px 4px 2px 0;
    }

    .title {
      margin: 0;
      font-size: .95rem;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
    }

    .watch {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .73rem;
    }

    .asset-icon {
      flex: 0 0 132px;
      width: 132px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #0a0c0f;
      color: #c8d0d8;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      border: 1px solid #1d232a;
    }

    .external {
      margin-left: auto;
      color: var(--muted);
      font-size: .9rem;
      padding-right: 4px;
    }

    .disabled-card {
      opacity: .5;
    }

    .loading,
    .error,
    .empty {
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
    }

    @media (max-width: 520px) {
      .container {
        width: min(100% - 14px, 900px);
        padding-top: 16px;
      }

      .thumb-link {
        flex-basis: 112px;
      }

      .thumb-wrap,
      .asset-icon {
        width: 112px;
      }

      .title {
        font-size: .88rem;
      }

      .watch {
        font-size: .7rem;
      }

      .section {
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Arsip PKL Ahmad Rijani</h1>
      <div class="subtitle">
        Dokumentasi kegiatan, video, dan berkas PKL
      </div>
    </header>

    <!-- ========================= -->
    <!-- PUSAT VIDEO PRINTER -->
    <!-- ========================= -->

    <section class="section" id="printerSection">

      <div class="section-title">
        <h2>🎥 Pusat Video Printer</h2>
        <span>Video dokumentasi dan penggunaan printer</span>
      </div>

      <div class="grid" id="printerGrid">
        <div class="loading">
          Memuat video printer…
        </div>
      </div>

    </section>


    <!-- ========================= -->
    <!-- ARSIP PKL -->
    <!-- ========================= -->

    <section class="section" id="pklSection">

      <div class="section-title">
        <h2>📁 Arsip PKL</h2>
        <span>Dokumentasi dan berkas PKL Ahmad Rijani</span>
      </div>

      <div class="grid" id="pklGrid">
        <div class="loading">
          Memuat arsip PKL…
        </div>
      </div>

    </section>


    <footer>
      Arsip PKL Ahmad Rijani
    </footer>

  </main>


  <script>

    const printerGrid = document.getElementById('printerGrid');
    const pklGrid = document.getElementById('pklGrid');


    /*
     * Membuat kartu video
     */
    function createVideo(item) {

      const yt =
        item.href ||
        `https://www.youtube.com/watch?v=${item.id}`;

      const judul =
        item.title ||
        item.manualTitle ||
        'Memuat judul…';


      if (item.disabled) {

        return `
          <article class="card disabled-card">

            <div class="asset-icon">
              —
            </div>

            <div class="content">

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Link belum tersedia
              </span>

            </div>

          </article>
        `;
      }


      return `
        <article class="card">

          <a
            class="thumb-link"
            href="${yt}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >

            <div class="thumb-wrap">

              <img
                class="thumb"
                src="https://img.youtube.com/vi/${item.id}/hqdefault.jpg"
                alt=""
                loading="lazy"
                onerror="
                  this.parentElement.classList.add('no-thumb');
                  this.remove();
                "
              >

              <span class="play">
                ▶
              </span>

            </div>

          </a>


          <div class="content">

            <a
              href="${yt}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Tonton di YouTube ↗
              </span>

            </a>

          </div>

        </article>
      `;
    }


    /*
     * Membuat kartu file / link
     */
    function createFileOrLink(item) {

      const icon =
        item.icon ||
        'LINK';


      if (item.disabled) {

        return `
          <article class="card disabled-card">

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>

            <div class="content">

              <h3 class="title">
                ${escapeHTML(item.title || 'Tidak tersedia')}
              </h3>

            </div>

          </article>
        `;
      }


      return `
        <article class="card">

          <a
            class="thumb-link"
            href="${item.href}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(item.title || 'Link')}"
          >

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>

          </a>


          <div class="content">

            <a
              href="${item.href}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(item.title || 'Tanpa judul')}
              </h3>

            </a>

          </div>


          <span class="external">
            ↗
          </span>

        </article>
      `;
    }


    /*
     * Escape HTML supaya teks dari JSON
     * tidak langsung menjadi HTML.
     */
    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /*
     * Mengambil judul YouTube otomatis
     * hanya untuk video yang belum mempunyai
     * title/manualTitle.
     */
    async function autoTitle(item) {

      if (
        item.type !== 'video' ||
        item.title ||
        item.manualTitle ||
        item.disabled
      ) {
        return;
      }


      const el =
        document.querySelector(
          `[data-title="${item.id}"]`
        );


      if (!el) {
        return;
      }


      try {

        const response =
          await fetch(
            `https://www.youtube.com/oembed?url=${encodeURIComponent(
              `https://www.youtube.com/watch?v=${item.id}`
            )}&format=json`
          );


        if (!response.ok) {
          return;
        }


        const data =
          await response.json();


        if (data.title) {
          el.textContent = data.title;
        }


      } catch (error) {

        el.textContent =
          'Judul video tidak tersedia';

      }

    }


    /*
     * Memuat arsip.json
     */
    async function loadArchive() {

      try {

        const response =
          await fetch(
            '/file/arsip.json',
            {
              cache: 'no-cache'
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const items =
          await response.json();


        if (!Array.isArray(items)) {

          throw new Error(
            'Format arsip.json tidak valid'
          );

        }


        /*
         * Item printer
         */
        const printerItems =
          items.filter(
            item =>
              item.category === 'printer'
          );


        /*
         * Item PKL
         *
         * Semua item yang bukan printer
         * akan masuk ke bagian arsip PKL.
         */
        const pklItems =
          items.filter(
            item =>
              item.category !== 'printer'
          );


        /*
         * Render printer
         */
        if (printerItems.length === 0) {

          printerGrid.innerHTML = `
            <div class="empty">
              Belum ada video printer.
            </div>
          `;

        } else {

          printerGrid.innerHTML =
            printerItems
              .map(item => {

                if (item.type === 'video') {
                  return createVideo(item);
                }

                return createFileOrLink(item);

              })
              .join('');

        }


        /*
         * Render arsip PKL
         */
        if (pklItems.length === 0) {

          pklGrid.innerHTML = `
            <div class="empty">
              Belum ada arsip PKL.
            </div>
          `;

        } else {

          pklGrid.innerHTML =
            pklItems
              .map(item => {

                if (item.type === 'video') {
                  return createVideo(item);
                }

                return createFileOrLink(item);

              })
              .join('');

        }


        /*
         * Coba mengambil judul YouTube
         * untuk video yang tidak mempunyai
         * title di JSON.
         */
        items.forEach(autoTitle);


      } catch (error) {

        console.error(
          'Gagal memuat arsip:',
          error
        );


        printerGrid.innerHTML = `
          <div class="error">
            Gagal memuat
            <b>/file/arsip.json</b>
          </div>
        `;


        pklGrid.innerHTML = `
          <div class="error">
            Gagal memuat
            <b>/file/arsip.json</b>
          </div>
        `;

      }

    }


    /*
     * Jalankan
     */
    loadArchive();

  </script>

</body>
</html>
