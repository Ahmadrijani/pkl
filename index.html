<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Dokumentasi Utama — Ahmad Rijani</title>

  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #151a20;
      --line: #252c34;
      --text: #eef2f6;
      --muted: #9aa4af;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #151a20 0,
          var(--bg) 38%,
          #080a0d 100%
        );
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    header {
      margin-bottom: 26px;
    }

    h1 {
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      letter-spacing: -.025em;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .82rem;
    }

    .section {
      margin-top: 28px;
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .section-title {
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-size: 1.05rem;
    }

    .section-title span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-top: 2px;
    }

    .grid {
      display: grid;
      gap: 9px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      transition:
        border-color .2s ease,
        transform .2s ease,
        background .2s ease;
    }

    .card:hover {
      border-color: #3a444f;
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    .thumb-link {
      flex: 0 0 132px;
    }

    .thumb-wrap {
      position: relative;
      width: 132px;
      aspect-ratio: 16 / 9;
      background: #0a0c0f;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1d232a;
    }

    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.16);
      font-size: .72rem;
    }

    .asset-icon {
      flex: 0 0 132px;
      width: 132px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #0a0c0f;
      color: #c8d0d8;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      border: 1px solid #1d232a;
    }

    .content {
      min-width: 0;
      flex: 1;
      padding: 2px 4px 2px 0;
    }

    .title {
      margin: 0;
      font-size: .95rem;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
    }

    .watch {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .73rem;
    }

    .external {
      margin-left: auto;
      color: var(--muted);
      font-size: .9rem;
      padding-right: 4px;
    }

    .disabled-card {
      opacity: .5;
    }

    .loading,
    .error,
    .empty {
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .error strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
    }


    /* ============================== */
    /* JAVASCRIPT WARNING             */
    /* ============================== */

    .js-warning {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at top,
          #151a20 0,
          #0b0d10 45%,
          #080a0d 100%
        );
    }

    .js-warning-box {
      width: min(430px, 100%);
      padding: 28px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .js-warning-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .js-warning-box h2 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .js-warning-box p {
      margin: 8px 0;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.6;
    }

    .js-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .js-button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 10px 16px;
      background: var(--white);
      color: #111;
      font-weight: 700;
      cursor: pointer;
      font-size: .82rem;
    }

    .js-button.secondary {
      background: #1d232a;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .browser-info {
      margin-top: 14px;
      color: var(--muted);
      font-size: .7rem;
    }


    @media (max-width: 520px) {

      .container {
        width: min(100% - 14px, 900px);
        padding-top: 16px;
      }

      .thumb-link {
        flex-basis: 112px;
      }

      .thumb-wrap,
      .asset-icon {
        width: 112px;
      }

      .title {
        font-size: .88rem;
      }

      .watch {
        font-size: .7rem;
      }

      .section {
        margin-top: 24px;
      }

    }
  </style>
</head>


<body>


  <!--
    Kalau JavaScript benar-benar mati,
    bagian ini tetap akan muncul.
  -->

  <noscript>

    <div class="js-warning">

      <div class="js-warning-box">

        <div class="js-warning-icon">
          ⚠️
        </div>

        <h2>
          JavaScript Tidak Aktif
        </h2>

        <p>
          Dokumentasi utama membutuhkan JavaScript
          untuk membaca data arsip.
        </p>

        <p>
          Aktifkan JavaScript pada pengaturan browser,
          kemudian tekan tombol muat ulang.
        </p>

        <div class="js-buttons">

          <button
            class="js-button"
            onclick="window.location.reload()"
          >
            ↻ Muat Ulang
          </button>

          <button
            class="js-button secondary"
            onclick="tampilkanPanduanJS()"
          >
            ⚙ Nyalakan JavaScript
          </button>

        </div>

        <div
          class="browser-info"
          id="browserInfo"
        ></div>

      </div>

    </div>

  </noscript>



  <main class="container">

    <header>

      <h1>
        Dokumentasi Utama Ahmad Rijani
      </h1>

      <div class="subtitle">
        Dokumentasi, video, dan berkas PKL
      </div>

    </header>


    <section
      class="section"
      id="dokumentasiSection"
    >

      <div class="section-title">

        <h2>
          📁 Dokumentasi Utama
        </h2>

        <span>
          Seluruh dokumentasi yang tersedia
        </span>

      </div>


      <div
        class="grid"
        id="dokumentasiGrid"
      >

        <div class="loading">
          Memuat dokumentasi…
        </div>

      </div>

    </section>


    <footer>
      Arsip PKL Ahmad Rijani
    </footer>

  </main>



  <script>


    /* ====================================== */
    /* KONFIGURASI SUMBER DATA                */
    /* ====================================== */

    const SUMBER_ARSIP = [

      "/file/arsip.json",

      "./file/arsip.json",

      "https://raw.githubusercontent.com/Ahmadrijani/pkl/refs/heads/main/file/arsip.json"

    ];


    const dokumentasiGrid =
      document.getElementById(
        "dokumentasiGrid"
      );



    /* ====================================== */
    /* ESCAPE HTML                            */
    /* ====================================== */

    function escapeHTML(nilai) {

      return String(nilai ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /* ====================================== */
    /* VIDEO                                  */
    /* ====================================== */

    function createVideo(item) {

      const link =
        item.href ||
        `https://www.youtube.com/watch?v=${item.id}`;

      const judul =
        item.title ||
        item.manualTitle ||
        "Memuat judul…";


      if (item.disabled) {

        return `

          <article class="card disabled-card">

            <div class="asset-icon">
              —
            </div>

            <div class="content">

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Link belum tersedia
              </span>

            </div>

          </article>

        `;

      }


      return `

        <article class="card">

          <a
            class="thumb-link"
            href="${link}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >

            <div class="thumb-wrap">

              <img
                class="thumb"
                src="https://img.youtube.com/vi/${encodeURIComponent(item.id)}/hqdefault.jpg"
                alt=""
                loading="lazy"
                onerror="
                  this.style.display='none';
                "
              >

              <span class="play">
                ▶
              </span>

            </div>

          </a>


          <div class="content">

            <a
              href="${link}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Tonton di YouTube ↗
              </span>

            </a>

          </div>

        </article>

      `;

    }



    /* ====================================== */
    /* FILE DAN LINK                          */
    /* ====================================== */

    function createFileOrLink(item) {

      const icon =
        item.icon ||
        "LINK";


      if (item.disabled) {

        return `

          <article class="card disabled-card">

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>

            <div class="content">

              <h3 class="title">
                ${escapeHTML(
                  item.title ||
                  "Tidak tersedia"
                )}
              </h3>

            </div>

          </article>

        `;

      }


      return `

        <article class="card">

          <a
            class="thumb-link"
            href="${item.href}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(
              item.title ||
              "Link"
            )}"
          >

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>

          </a>


          <div class="content">

            <a
              href="${item.href}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(
                  item.title ||
                  "Tanpa judul"
                )}
              </h3>

            </a>

          </div>


          <span class="external">
            ↗
          </span>

        </article>

      `;

    }



    /* ====================================== */
    /* MENCARI SUMBER ARSIP                   */
    /* ====================================== */

    async function ambilArsip() {

      let errorTerakhir = null;


      for (
        const sumber of SUMBER_ARSIP
      ) {

        try {

          const response =
            await fetch(
              sumber,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `HTTP ${response.status}`
            );

          }


          const data =
            await response.json();


          if (!Array.isArray(data)) {

            throw new Error(
              "Format JSON harus berupa array"
            );

          }


          console.log(
            "Arsip berhasil dimuat dari:",
            sumber
          );


          return data;


        } catch (error) {

          console.warn(
            "Sumber gagal:",
            sumber,
            error
          );

          errorTerakhir = error;

        }

      }


      throw errorTerakhir ||
        new Error(
          "Semua sumber arsip gagal"
        );

    }



    /* ====================================== */
    /* RENDER                                 */
    /* ====================================== */

    function renderDokumentasi(items) {

      if (
        !items ||
        items.length === 0
      ) {

        dokumentasiGrid.innerHTML = `

          <div class="empty">
            Belum ada dokumentasi.
          </div>

        `;

        return;

      }


      dokumentasiGrid.innerHTML =
        items
          .map(item => {

            if (
              item.type === "video"
            ) {

              return createVideo(item);

            }


            return createFileOrLink(item);

          })
          .join("");

    }



    /* ====================================== */
    /* AUTO JUDUL YOUTUBE                     */
    /* ====================================== */

    async function autoTitle(item) {

      if (
        item.type !== "video" ||
        item.title ||
        item.manualTitle ||
        item.disabled
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            `https://www.youtube.com/oembed?url=${encodeURIComponent(
              `https://www.youtube.com/watch?v=${item.id}`
            )}&format=json`
          );


        if (!response.ok) {
          return;
        }


        const data =
          await response.json();


        const elemen =
          document.querySelector(
            `[data-title="${item.id}"]`
          );


        if (
          elemen &&
          data.title
        ) {

          elemen.textContent =
            data.title;

        }


      } catch (error) {

        console.warn(
          "Judul YouTube gagal diambil:",
          item.id
        );

      }

    }



    /* ====================================== */
    /* ERROR                                  */
    /* ====================================== */

    function tampilkanError(error) {

      dokumentasiGrid.innerHTML = `

        <div class="error">

          <strong>
            ⚠️ Gagal memuat dokumentasi
          </strong>

          <div>
            Semua sumber arsip tidak dapat diakses.
          </div>

          <div style="margin-top:8px;">
            Silakan periksa koneksi internet,
            kemudian muat ulang halaman.
          </div>

          <div style="margin-top:14px;">

            <button
              class="js-button"
              onclick="window.location.reload()"
            >
              ↻ Coba Lagi
            </button>

          </div>

        </div>

      `;

      console.error(
        "Arsip gagal dimuat:",
        error
      );

    }



    /* ====================================== */
    /* LOAD UTAMA                             */
    /* ====================================== */

    async function loadArchive() {

      try {

        const items =
          await ambilArsip();


        renderDokumentasi(items);


        /*
         * Judul YouTube otomatis.
         */
        items.forEach(
          item => autoTitle(item)
        );


      } catch (error) {

        tampilkanError(error);

      }

    }



    /* ====================================== */
    /* PANDUAN JAVASCRIPT                     */
    /* ====================================== */

    function tampilkanPanduanJS() {

      const pesan = `

JavaScript tidak dapat dinyalakan
langsung oleh sebuah halaman web.

Silakan buka pengaturan browser,
aktifkan JavaScript untuk situs ini,
kemudian kembali ke halaman ini
dan tekan "Muat Ulang".

Chrome / Chromium:
Pengaturan → Privasi dan keamanan
→ Setelan situs → JavaScript

Edge:
Pengaturan → Cookie dan izin situs
→ JavaScript

Firefox:
JavaScript biasanya aktif secara default.

      `;


      alert(pesan);

    }



    /* ====================================== */
    /* START                                  */
    /* ====================================== */

    loadArchive();

  </script>

</body>
</html>
