<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Arsip Ahmad Rijani</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    /* =========================================================
       DOKUMENTASI UTAMA — gaya retro web 2007, CSS vanilla ringan
       ========================================================= */

    :root {
      --bg-top: #dfe9f5;
      --bg-bottom: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #edf3fb;
      --line: #aebed2;
      --line-dark: #7e94af;
      --text: #1e2a36;
      --muted: #657385;
      --blue: #2f5f9d;
      --blue-dark: #1e467a;
      --blue-soft: #dbe9f8;
      --green: #2f7b45;
      --red: #b33838;
      --yellow: #a86f00;
      --shadow: rgba(22, 47, 78, .18);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Tahoma, Verdana, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      background:
        linear-gradient(to bottom, var(--bg-top) 0, var(--bg-bottom) 230px),
        #f7f9fc;
    }

    a { color: #1b5da7; text-decoration: none; }
    a:hover { text-decoration: underline; }

    button,
    input { font: inherit; }

    .page {
      width: min(1050px, calc(100% - 22px));
      margin: 18px auto 28px;
    }

    /* TOP BAR */
    .topbar {
      background: linear-gradient(#5f86b5, #2f5f9d 48%, #244d82);
      border: 1px solid #1d426f;
      color: #fff;
      min-height: 42px;
      padding: 7px 10px;
      border-radius: 5px 5px 0 0;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        0 2px 5px var(--shadow);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid #dcecff;
      border-radius: 4px;
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      background: linear-gradient(#ffffff, #d9e7f7);
      color: #244d82;
      font-weight: bold;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.20);
    }

    .brand {
      min-width: 0;
      flex: 1;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand small {
      display: block;
      color: #e8f1fb;
      font-size: 10px;
      margin-top: 1px;
    }

    .status-pill {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(0,0,0,.16);
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 10px;
      white-space: nowrap;
    }

    /* HEADER / TOOLBAR */
    .header-panel {
      background: linear-gradient(#ffffff, #f0f4f8);
      border: 1px solid var(--line);
      border-top: 0;
      padding: 14px;
      box-shadow: 0 2px 5px var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: #203d62;
      text-shadow: 0 1px 0 #fff;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1 1 320px;
      min-width: 220px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 34px;
      padding: 7px 38px 7px 10px;
      border: 1px solid #93a9c1;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      box-shadow: inset 0 2px 3px rgba(0,0,0,.08);
      outline: none;
    }

    .search-box input:focus {
      border-color: #4b77a8;
      box-shadow: inset 0 2px 3px rgba(0,0,0,.08), 0 0 0 2px rgba(69,121,177,.14);
    }

    .search-icon {
      position: absolute;
      right: 9px;
      top: 7px;
      color: #56718f;
      pointer-events: none;
      font-weight: bold;
    }

    .button {
      height: 34px;
      padding: 0 11px;
      border: 1px solid #7f96af;
      border-radius: 4px;
      cursor: pointer;
      color: #233f61;
      background: linear-gradient(#ffffff, #dfe8f1);
      box-shadow: inset 0 1px 0 #fff, 0 1px 1px rgba(0,0,0,.06);
      text-shadow: 0 1px #fff;
    }

    .button:hover {
      background: linear-gradient(#ffffff, #d4e2ef);
    }

    .button:active {
      box-shadow: inset 0 2px 3px rgba(0,0,0,.10);
      transform: translateY(1px);
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .info-badge {
      display: inline-block;
      padding: 3px 7px;
      border: 1px solid #b2c3d6;
      border-radius: 3px;
      background: var(--blue-soft);
      color: #31567e;
      font-size: 10px;
      font-weight: bold;
    }

    .kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid #9eaebe;
      border-bottom-color: #738399;
      border-radius: 3px;
      background: #f8fafc;
      color: #3f4e61;
      font-family: monospace;
      font-size: 10px;
    }

    /* CONTENT */
    .section {
      margin-top: 13px;
      background: rgba(255,255,255,.93);
      border: 1px solid var(--line);
      box-shadow: 0 2px 5px var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 11px;
      border-bottom: 1px solid #a9b8ca;
      background: linear-gradient(#f7fbff, #dbe7f2);
    }

    .section-head h2 {
      margin: 0;
      font-size: 14px;
      color: #24466d;
    }

    .section-head span {
      color: #60758d;
      font-size: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .card {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding: 7px;
      border: 1px solid #c4d0dd;
      border-radius: 4px;
      background: linear-gradient(#ffffff, #f7f9fb);
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(31,55,84,.08);
      transition: border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }

    .card:hover {
      border-color: #7897b9;
      box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(31,55,84,.14);
      transform: translateY(-1px);
    }

    .thumb-link,
    .asset-icon {
      flex: 0 0 150px;
    }

    .thumb-wrap,
    .asset-icon {
      width: 150px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid #879eb7;
      background: #dde5ee;
    }

    .thumb-wrap {
      position: relative;
    }

    .thumb {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #d9e1ea;
    }

    .thumb-fallback {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      color: #56718f;
      font-size: 11px;
      font-weight: bold;
      background: linear-gradient(135deg, #eef4fa, #d4e0ec);
    }

    .play {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid #163e69;
      border-radius: 3px;
      color: white;
      background: linear-gradient(#5f92c5, #27588f);
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
      font-size: 11px;
    }

    .asset-icon {
      display: grid;
      place-items: center;
      color: #3f6288;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: .06em;
      background:
        linear-gradient(135deg, transparent 49%, rgba(255,255,255,.55) 50%, transparent 51%),
        linear-gradient(#f2f6fa, #dbe5ef);
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: bold;
      word-break: break-word;
      color: #2c4f76;
    }

    .watch {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .loading-title {
      color: #8a97a6;
    }

    .external {
      margin-left: auto;
      padding-right: 3px;
      color: #71839a;
      font-size: 14px;
    }

    .disabled-card {
      opacity: .58;
    }

    /* SKELETON */
    .skeleton {
      pointer-events: none;
    }

    .skeleton-block {
      position: relative;
      overflow: hidden;
      background: #e3e9f0;
      border-radius: 3px;
    }

    .skeleton-block::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      animation: skeleton-shimmer 1.2s infinite;
    }

    .skeleton-thumb {
      flex: 0 0 150px;
      width: 150px;
      aspect-ratio: 16 / 9;
    }

    .skeleton-lines { flex: 1; min-width: 0; }
    .skeleton-line { height: 9px; margin: 6px 0; }
    .skeleton-line.big { width: 85%; height: 12px; }
    .skeleton-line.mid { width: 62%; }
    .skeleton-line.small { width: 40%; }

    @keyframes skeleton-shimmer {
      to { transform: translateX(100%); }
    }

    /* STATUS BOX */
    .status-box {
      margin: 10px;
      padding: 14px;
      border: 1px solid #c3ceda;
      border-radius: 4px;
      background: linear-gradient(#ffffff, #f3f6f9);
    }

    .status-box strong {
      display: block;
      margin-bottom: 4px;
      color: #2e4868;
    }

    .status-box.error {
      border-color: #d6aaaa;
      background: linear-gradient(#fffafa, #f8eded);
    }

    .status-box.error strong { color: #9b3333; }

    .status-box.warning {
      border-color: #d7c69f;
      background: linear-gradient(#fffdf7, #f8f2df);
    }

    .status-text {
      color: #5d6d7d;
      font-size: 11px;
    }

    .help-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .help-item {
      padding: 7px 8px;
      border: 1px solid #ccd6e0;
      background: #fff;
      border-radius: 3px;
      color: #4f6175;
      font-size: 10px;
    }

    .help-item b { color: #2c4f76; }

    .status-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .status-actions .button.primary {
      color: #fff;
      border-color: #1d4a7e;
      text-shadow: 0 -1px rgba(0,0,0,.25);
      background: linear-gradient(#5f92c5, #2f5f9d 55%, #244b7d);
    }

    .status-actions .button.primary:hover {
      background: linear-gradient(#6b9ccc, #3969a4 55%, #2b5588);
    }

    .details {
      margin-top: 9px;
      color: #7a8795;
      font-size: 10px;
      word-break: break-word;
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* JS DISABLED OVERLAY */
    .noscript-box {
      padding: 13px;
      margin: 12px auto;
      width: min(700px, calc(100% - 22px));
      border: 1px solid #d7ad68;
      border-radius: 4px;
      background: linear-gradient(#fffdf6, #f9f0d7);
      color: #6f5a2e;
      box-shadow: 0 2px 5px var(--shadow);
    }

    /* FOOTER */
    footer {
      padding: 12px 5px 0;
      text-align: center;
      color: #718093;
      font-size: 10px;
      text-shadow: 0 1px #fff;
    }

    /* MOBILE */

    /* =========================================================
       BLACK / COMPACT MODE — tetap ringan di HP
       ========================================================= */
    :root {
      --bg-top: #000;
      --bg-bottom: #000;
      --panel: #0b0b0b;
      --panel-soft: #101010;
      --line: #242424;
      --line-dark: #3a3a3a;
      --text: #f2f2f2;
      --muted: #888;
      --blue: #cfcfcf;
      --blue-dark: #fff;
      --blue-soft: #161616;
      --shadow: rgba(0,0,0,0.55);
    }

    body {
      background: #000;
      color: var(--text);
    }

    .page {
      width: min(1100px, calc(100% - 16px));
      margin: 8px auto 18px;
    }

    .topbar { display: none; }

    .topbar {
      min-height: 42px;
      padding: 6px 8px;
      border: 1px solid #252525;
      border-radius: 4px;
      background: linear-gradient(#151515, #090909);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 5px rgba(0,0,0,.55);
    }

    .topbar-inner { gap: 8px; }

    .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border: 1px solid #3b3b3b;
      background: linear-gradient(#2a2a2a, #111);
      color: #fff;
      box-shadow: inset 0 1px 2px rgba(255,255,255,.08);
      font-size: 11px;
    }

    .brand { display: none; }

    .status-pill {
      margin-left: auto;
      border-color: #333;
      background: #111;
      color: #aaa;
    }

    .header-panel {
      border: 1px solid #252525;
      border-top: 0;
      padding: 8px;
      background: #080808;
      box-shadow: 0 2px 5px rgba(0,0,0,.45);
    }

    .header-panel h1,
    .header-panel .subtitle { display: none; }

    .toolbar {
      margin-top: 0;
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
    }

    .search-box {
      min-width: 0;
      flex: 1 1 auto;
      height: 34px;
    }

    .search-box input {
      height: 34px;
      padding: 7px 36px 7px 32px;
      border-color: #353535;
      border-radius: 3px;
      background: #000;
      color: #eee;
      box-shadow: inset 0 2px 3px rgba(255,255,255,.03);
    }

    .search-box input::placeholder { color: #666; }
    .search-box input:focus { border-color: #666; box-shadow: 0 0 0 1px #222; }

    .search-icon {
      left: 10px;
      right: auto;
      top: 8px;
      color: #777;
      font-weight: normal;
    }

    .search-icon .fa-solid { display: inline-block; }

    .search-clear {
      position: absolute;
      right: 7px;
      top: 4px;
      width: 26px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      padding: 0;
      border-radius: 3px;
    }

    .search-clear:hover { color: #fff; background: #151515; }
    .search-clear:disabled { opacity: .3; cursor: default; }

    .toolbar > .button { display: none; }

    .summary { display: none; }

    .section {
      margin-top: 8px;
      background: #050505;
      border-color: #222;
      box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    .section-head {
      padding: 7px 9px;
      border-bottom-color: #242424;
      background: linear-gradient(#151515, #0a0a0a);
    }

    .section-head h2 { color: #ddd; font-size: 13px; }
    .section-head span { color: #777; }

    .grid { gap: 7px; padding: 7px; }

    .card {
      gap: 9px;
      padding: 6px;
      border-color: #242424;
      border-radius: 3px;
      background: linear-gradient(#101010, #080808);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }

    .card:hover {
      border-color: #444;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 4px rgba(0,0,0,.45);
    }

    .thumb-wrap,
    .asset-icon {
      border-color: #333;
      background: #0e0e0e;
    }

    .asset-icon {
      color: #aaa;
      background: linear-gradient(135deg, #141414, #080808);
    }

    .thumb-fallback { color: #666; background: linear-gradient(135deg, #131313, #080808); }

    .play {
      border-color: #444;
      background: linear-gradient(#333, #181818);
      color: #fff;
    }

    .title { color: #e5e5e5; }
    .watch { color: #777; }
    a { color: inherit; }
    a:hover .title { color: #fff; }
    .external { color: #777; }

    .skeleton-block { background: #171717; }
    .skeleton-block::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }

    .status-box {
      border-color: #292929;
      border-radius: 3px;
      background: linear-gradient(#111, #090909);
    }

    .status-box strong { color: #ddd; }
    .status-box.error { border-color: #4b2626; background: linear-gradient(#160d0d, #0b0707); }
    .status-box.error strong { color: #ff9b9b; }
    .status-box.warning { border-color: #4b4128; background: linear-gradient(#151208, #0b0905); }
    .status-text { color: #888; }
    .help-grid { gap: 6px; }
    .help-item { border-color: #2b2b2b; background: #0c0c0c; color: #888; }
    .help-item b { color: #ddd; }

    .button {
      border-color: #3b3b3b;
      background: linear-gradient(#1b1b1b, #0b0b0b);
      color: #ddd;
      text-shadow: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    .status-actions .button.primary {
      border-color: #4a4a4a;
      background: linear-gradient(#303030, #151515);
    }

    .noscript-box {
      border-color: #4b4128;
      background: linear-gradient(#151208, #0b0905);
      color: #c4b27d;
      box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    footer { color: #555; text-shadow: none; }

    /* Saat pencarian aktif, footer dan area tambahan tidak perlu ditampilkan. */
    body.searching footer { display: none; }

    .no-result-actions {
      margin-top: 12px;
      display: flex;
      justify-content: center;
    }

    .clear-search-bottom {
      min-height: 34px;
      padding: 7px 14px;
      border: 1px solid #454545;
      border-radius: 3px;
      background: linear-gradient(#242424, #111111);
      color: #f1f1f1;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    .clear-search-bottom:hover {
      background: linear-gradient(#2c2c2c, #151515);
      border-color: #5a5a5a;
    }

    .clear-search-bottom:active {
      transform: translateY(1px);
    }

    @media (max-width: 560px) {
      .page { width: calc(100% - 8px); margin-top: 4px; }
      .topbar-inner { gap: 5px; }
      .brand-mark { width: 26px; height: 26px; flex-basis: 26px; }
      .header-panel { padding: 6px; }
      .toolbar { gap: 4px; }
      .search-box { flex: 1 1 auto; width: auto; }
      .search-box input { height: 32px; padding-left: 30px; }
      .section { margin-top: 5px; }
      .section-head { padding: 6px 8px; }
      .grid { padding: 5px; gap: 5px; }
      .card { padding: 5px; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 2px; }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 10px, 1050px);
        margin-top: 7px;
      }

      .topbar-inner { align-items: flex-start; }
      .status-pill { display: none; }
      h1 { font-size: 19px; }

      .header-panel { padding: 11px; }
      .toolbar { display: block; }
      .search-box { width: 100%; }
      .toolbar .button { margin-top: 7px; }

      .card { align-items: flex-start; }
      .thumb-link,
      .asset-icon,
      .skeleton-thumb {
        flex-basis: 110px;
        width: 110px;
      }

      .help-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 410px) {
      .card { display: block; }
      .thumb-link,
      .asset-icon,
      .skeleton-thumb {
        display: block;
        width: 100%;
        max-width: 100%;
        margin-bottom: 8px;
      }

      .thumb-wrap { width: 100%; }
      .content { width: 100%; }
      .external { display: none; }
    }
  </style>
</head>

<body>
  <noscript>
    <div class="noscript-box">
      <strong><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> JavaScript sedang mati.</strong><br>
      Halaman ini membutuhkan JavaScript untuk membaca arsip, pencarian, dan memuat daftar dokumentasi.
      Aktifkan JavaScript pada browser, lalu muat ulang halaman.
    </div>
  </noscript>

  <div class="page">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand-mark">AR</div>
        <div class="brand">
          <strong>Dokumentasi Utama Ahmad Rijani</strong>
          <small>Arsip dokumentasi, video, dan berkas PKL</small>
        </div>
        <div class="status-pill" id="connectionStatus">● memeriksa koneksi…</div>
      </div>
    </div>

    <header class="header-panel" aria-label="Pencarian arsip">
      <div class="toolbar">
        <label class="search-box" aria-label="Cari dokumentasi">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Cari arsip…"
            disabled
          >
          <button class="search-clear" id="clearSearch" type="button" aria-label="Hapus pencarian" title="Hapus pencarian" disabled>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </label>
        <button class="button primary" id="retryTop" type="button">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i>
          <span class="sr-only">Muat ulang</span>
        </button>
      </div>

      <div class="summary">
        <span class="info-badge" id="resultCount">Belum dimuat</span>
        <span class="status-text">Tip: tekan <span class="kbd">Ctrl</span> + <span class="kbd">F</span> untuk fokus pencarian.</span>
      </div>
    </header>

    <main>
      <section class="section" id="dokumentasiSection">
        <div class="section-head">
          <h2><i class="fa-solid fa-folder-open" aria-hidden="true"></i> Arsip</h2>
          <span id="sectionHint">Memuat arsip…</span>
        </div>

        <div class="grid" id="dokumentasiGrid" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      Arsip Ahmad Rijani
    </footer>
  </div>

  <script>
    "use strict";

    /* =========================================================
       SUMBER ARSIP
       ========================================================= */
    const SUMBER_ARSIP = [
      "/file/arsip.json",
      "./file/arsip.json",
      "https://raw.githubusercontent.com/Ahmadrijani/pkl/refs/heads/main/file/arsip.json"
    ];

    const dokumentasiGrid = document.getElementById("dokumentasiGrid");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const retryTop = document.getElementById("retryTop");
    const resultCount = document.getElementById("resultCount");
    const sectionHint = document.getElementById("sectionHint");
    const connectionStatus = document.getElementById("connectionStatus");

    let semuaItem = [];
    let sedangMemuat = false;

    /* =========================================================
       HELPERS
       ========================================================= */
    function escapeHTML(nilai) {
      return String(nilai ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeText(nilai) {
      return String(nilai ?? "").toLowerCase().trim();
    }

    function getVideoId(item) {
      if (item && item.id) return String(item.id);

      if (!item || !item.href) return "";

      try {
        const url = new URL(item.href, window.location.href);

        if (url.hostname === "youtu.be") {
          return url.pathname.replace("/", "").trim();
        }

        if (url.hostname.includes("youtube.com")) {
          return url.searchParams.get("v") || "";
        }
      } catch (error) {
        console.warn("URL video tidak valid:", item.href, error);
      }

      return "";
    }

    function createSkeleton(count = 6) {
      return Array.from({ length: count }, () => `
        <article class="card skeleton" aria-hidden="true">
          <div class="skeleton-block skeleton-thumb"></div>
          <div class="skeleton-lines">
            <div class="skeleton-block skeleton-line big"></div>
            <div class="skeleton-block skeleton-line mid"></div>
            <div class="skeleton-block skeleton-line small"></div>
          </div>
        </article>
      `).join("");
    }

    function setConnectionStatus(label, online) {
      connectionStatus.textContent = online ? "● online" : "● offline";
      connectionStatus.style.background = online
        ? "rgba(34, 123, 69, .18)"
        : "rgba(179, 56, 56, .20)";
    }

    function setCount(visible, total) {
      if (!total) {
        resultCount.textContent = "Belum ada data";
        return;
      }

      resultCount.textContent = visible === total
        ? `${total} item`
        : `${visible} dari ${total} item`;
    }

    function itemSearchText(item) {
      return [
        item?.title,
        item?.manualTitle,
        item?.href,
        item?.type,
        item?.icon,
        item?.id
      ].map(normalizeText).join(" ");
    }

    /* =========================================================
       RENDER VIDEO
       ========================================================= */
    function createVideo(item, index) {
      const videoId = getVideoId(item);
      const link = item.href || (
        videoId
          ? `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`
          : "#"
      );

      const sudahAdaJudul = Boolean(item.title || item.manualTitle);
      const judul = item.title || item.manualTitle || "Memuat judul…";

      if (item.disabled) {
        return `
          <article class="card disabled-card">
            <div class="asset-icon">VIDEO</div>
            <div class="content">
              <h3 class="title">${escapeHTML(judul)}</h3>
              <span class="watch">Link belum tersedia</span>
            </div>
          </article>
        `;
      }

      if (!videoId) {
        return `
          <article class="card">
            <div class="asset-icon">VIDEO</div>
            <div class="content">
              <h3 class="title">${escapeHTML(
                judul === "Memuat judul…" ? "Video tidak valid" : judul
              )}</h3>
              <span class="watch">ID video tidak ditemukan</span>
            </div>
          </article>
        `;
      }

      return `
        <article class="card">
          <a
            class="thumb-link"
            href="${escapeHTML(link)}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >
            <div class="thumb-wrap">
              <img
                class="thumb"
                src="https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg"
                alt=""
                loading="lazy"
                onerror="
                  this.style.display='none';
                  var f=this.nextElementSibling;
                  if(f) f.style.display='grid';
                "
              >
              <span class="thumb-fallback">THUMBNAIL TIDAK TERSEDIA</span>
              <span class="play">▶</span>
            </div>
          </a>

          <div class="content">
            <a
              href="${escapeHTML(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3
                class="title ${sudahAdaJudul ? "" : "loading-title"}"
                data-title-index="${index}"
              >
                ${escapeHTML(judul)}
              </h3>
              <span class="watch">Tonton di YouTube ↗</span>
            </a>
          </div>
        </article>
      `;
    }

    /* =========================================================
       RENDER FILE / LINK
       ========================================================= */
    function createFileOrLink(item) {
      const icon = item.icon || "LINK";
      const judul = item.title || "Tanpa judul";
      const href = item.href || "#";

      if (item.disabled) {
        return `
          <article class="card disabled-card">
            <div class="asset-icon">${escapeHTML(icon)}</div>
            <div class="content">
              <h3 class="title">${escapeHTML(judul)}</h3>
              <span class="watch">Link belum tersedia</span>
            </div>
          </article>
        `;
      }

      return `
        <article class="card">
          <a
            class="thumb-link"
            href="${escapeHTML(href)}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >
            <div class="asset-icon">${escapeHTML(icon)}</div>
          </a>

          <div class="content">
            <a
              href="${escapeHTML(href)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="title">${escapeHTML(judul)}</h3>
              <span class="watch">Buka dokumentasi ↗</span>
            </a>
          </div>

          <span class="external">↗</span>
        </article>
      `;
    }

    /* =========================================================
       YOUTUBE TITLE
       ========================================================= */
    async function ambilJudulYouTube(item, index) {
      if (item.title || item.manualTitle || item.disabled) return;

      const videoId = getVideoId(item);
      if (!videoId) return;

      const elemen = document.querySelector(`[data-title-index="${index}"]`);
      if (!elemen) return;

      try {
        const youtubeUrl =
          `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;

        const endpoint =
          `https://www.youtube.com/oembed?url=${encodeURIComponent(youtubeUrl)}&format=json`;

        const response = await fetch(endpoint);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();

        if (data && data.title) {
          elemen.textContent = data.title;
        } else {
          elemen.textContent = "Judul tidak tersedia";
        }

        elemen.classList.remove("loading-title");
      } catch (error) {
        console.warn("Gagal mengambil judul YouTube:", videoId, error);
        elemen.textContent = "Judul tidak tersedia";
        elemen.classList.remove("loading-title");
      }
    }

    /* =========================================================
       RENDER + FILTER
       ========================================================= */
    function renderDokumentasi(items) {
      if (!items || items.length === 0) {
        dokumentasiGrid.innerHTML = `
          <div class="status-box warning">
            <strong><i class="fa-solid fa-box-open" aria-hidden="true"></i> Belum ada dokumentasi</strong>
            <div class="status-text">Arsip berhasil dibaca, tetapi belum berisi item.</div>
          </div>
        `;
        setCount(0, 0);
        sectionHint.textContent = "0 item";
        return;
      }

      dokumentasiGrid.innerHTML = items.map((item, index) => {
        return item.type === "video"
          ? createVideo(item, index)
          : createFileOrLink(item);
      }).join("");

      items.forEach((item, index) => {
        if (item.type === "video") ambilJudulYouTube(item, index);
      });

      setCount(items.length, semuaItem.length);
      sectionHint.textContent = `${items.length} item ditampilkan`;
    }

    function filterDokumentasi() {
      if (!semuaItem.length) return;

      const query = normalizeText(searchInput.value);
      document.body.classList.toggle("searching", Boolean(query));

      if (!query) {
        document.body.classList.remove("searching");
        renderDokumentasi(semuaItem);
        return;
      }

      const hasil = semuaItem.filter(item =>
        itemSearchText(item).includes(query)
      );

      if (!hasil.length) {
        dokumentasiGrid.innerHTML = `
          <div class="status-box warning">
            <strong><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Tidak ada hasil</strong>
            <div class="status-text">
              Tidak ada dokumentasi yang cocok dengan "<b>${escapeHTML(searchInput.value)}</b>".
              Coba kata kunci yang lebih pendek.
            </div>
            <div class="no-result-actions">
              <button class="clear-search-bottom" id="clearSearchBottom" type="button">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i> HAPUS PENCARIAN
              </button>
            </div>
          </div>
        `;
        setCount(0, semuaItem.length);
        sectionHint.textContent = "Tidak ditemukan";
        return;
      }

      renderDokumentasi(hasil);
    }

    /* =========================================================
       AMBIL ARSIP
       ========================================================= */
    async function ambilArsip() {
      let errorTerakhir = null;
      const kegagalan = [];

      for (const sumber of SUMBER_ARSIP) {
        try {
          console.log("Mencoba sumber arsip:", sumber);

          const response = await fetch(sumber, {
            cache: "no-cache",
            headers: { "Accept": "application/json" }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (!Array.isArray(data)) {
            throw new Error("arsip.json harus berupa array");
          }

          console.log("Arsip berhasil:", sumber);
          return data;
        } catch (error) {
          errorTerakhir = error;
          kegagalan.push({
            sumber,
            pesan: error?.message || "Kesalahan tidak diketahui"
          });
          console.warn("Sumber gagal:", sumber, error);
        }
      }

      const err = errorTerakhir || new Error("Semua sumber gagal");
      err.detailGagal = kegagalan;
      throw err;
    }

    /* =========================================================
       ERROR HELPER
       ========================================================= */
    function tampilkanError(error) {
      console.error("Gagal memuat dokumentasi:", error);

      const offline = navigator.onLine === false;
      const fileProtocol = window.location.protocol === "file:";

      let kondisi = "Koneksi atau sumber arsip tidak merespons.";
      if (offline) {
        kondisi = "Browser mendeteksi tidak ada koneksi internet.";
      } else if (fileProtocol) {
        kondisi = "Halaman sedang dibuka langsung sebagai file lokal (file://). Browser dapat memblokir fetch arsip karena aturan keamanan.";
      }

      const detail = Array.isArray(error?.detailGagal)
        ? error.detailGagal
            .map(x => `${x.sumber} → ${x.pesan}`)
            .join(" | ")
        : (error?.message || "Tidak ada detail.");

      dokumentasiGrid.innerHTML = `
        <div class="status-box error">
          <strong><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Gagal memuat dokumentasi</strong>
          <div class="status-text">${escapeHTML(kondisi)}</div>

          <div class="help-grid">
            <div class="help-item"><b>🌐 Internet:</b> pastikan Wi‑Fi/data aktif lalu tekan <b>Coba Lagi</b>.</div>
            <div class="help-item"><b>⚙ JavaScript:</b> pastikan JavaScript diizinkan untuk halaman ini.</div>
            <div class="help-item"><b>🔄 Browser:</b> muat ulang halaman (Ctrl+R) setelah memperbaiki koneksi.</div>
            <div class="help-item"><b>📂 Lokal:</b> bila dibuka dari file, jalankan melalui web server lokal agar fetch JSON diizinkan.</div>
          </div>

          <div class="status-actions">
            <button class="button primary" type="button" onclick="loadArchive()"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Coba Lagi</button>
            <button class="button" type="button" onclick="window.location.reload()"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i> Muat Ulang</button>
            <button class="button" type="button" onclick="cekKoneksi()"><i class="fa-solid fa-globe" aria-hidden="true"></i> Cek Internet</button>
            <button class="button" type="button" onclick="nyalakanJavaScript()"><i class="fa-solid fa-code" aria-hidden="true"></i> Bantuan JavaScript</button>
          </div>

          <div class="details">
            Detail: ${escapeHTML(detail)}
          </div>
        </div>
      `;

      setCount(0, semuaItem.length);
      sectionHint.textContent = "Terjadi error";
    }

    function nyalakanJavaScript() {
      alert(
        "JavaScript tidak dapat dinyalakan otomatis dari halaman web.\\n\\n" +
        "Chrome/Edge: buka Pengaturan → Privasi & keamanan / Setelan situs → JavaScript → Izinkan.\\n\\n" +
        "Setelah itu, muat ulang halaman."
      );
    }

    async function cekKoneksi() {
      if (!navigator.onLine) {
        setConnectionStatus("● offline", false);
        alert("Browser mendeteksi Anda sedang offline. Nyalakan Wi‑Fi/data lalu coba lagi.");
        return false;
      }

      try {
        await fetch("https://www.gstatic.com/generate_204", {
          method: "GET",
          cache: "no-store",
          mode: "no-cors"
        });

        setConnectionStatus("● online", true);
        alert("Koneksi internet terdeteksi. Silakan tekan Coba Lagi.");
        return true;
      } catch (error) {
        setConnectionStatus("● offline", false);
        alert("Koneksi internet belum terdeteksi dari halaman ini. Coba buka situs lain untuk memastikan internet aktif.");
        return false;
      }
    }

    /* =========================================================
       LOAD
       ========================================================= */
    async function loadArchive() {
      if (sedangMemuat) return;
      sedangMemuat = true;

      retryTop.disabled = true;
      searchInput.disabled = true;
      clearSearch.disabled = true;

      dokumentasiGrid.innerHTML = createSkeleton(6);
      resultCount.textContent = "Memuat…";
      sectionHint.textContent = "Menghubungkan ke arsip…";

      try {
        setConnectionStatus(navigator.onLine ? "● online" : "● offline", navigator.onLine);

        const items = await ambilArsip();
        semuaItem = Array.isArray(items) ? items : [];
        document.body.classList.remove("searching");

        searchInput.disabled = false;
        clearSearch.disabled = false;

        renderDokumentasi(semuaItem);
      } catch (error) {
        tampilkanError(error);
      } finally {
        retryTop.disabled = false;
        sedangMemuat = false;
      }
    }

    /* =========================================================
       EVENT
       ========================================================= */
    searchInput.addEventListener("input", filterDokumentasi);

    function hapusPencarianDanTampilkanSemua() {
      searchInput.value = "";
      document.body.classList.remove("searching");
      filterDokumentasi();
      searchInput.focus();
    }

    clearSearch.addEventListener("click", hapusPencarianDanTampilkanSemua);

    dokumentasiGrid.addEventListener("click", (event) => {
      const target = event.target.closest("#clearSearchBottom");
      if (target) {
        hapusPencarianDanTampilkanSemua();
      }
    });

    retryTop.addEventListener("click", loadArchive);

    window.addEventListener("online", () => {
      setConnectionStatus("● online", true);
    });

    window.addEventListener("offline", () => {
      setConnectionStatus("● offline", false);
    });

    window.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "f") {
        event.preventDefault();
        searchInput.disabled = false;
        searchInput.focus();
        searchInput.select();
      }

      if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        filterDokumentasi();
      }
    });

    /* MULAI */
    loadArchive();
  </script>
</body>
</html>
