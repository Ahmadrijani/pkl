<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">

  <title>Dokumentasi Utama — Ahmad Rijani</title>

  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #151a20;
      --line: #252c34;
      --text: #eef2f6;
      --muted: #9aa4af;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #151a20 0,
          var(--bg) 38%,
          #080a0d 100%
        );

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    /* ============================== */
    /* HEADER                         */
    /* ============================== */

    header {
      margin-bottom: 26px;
    }

    h1 {
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      letter-spacing: -.025em;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .82rem;
    }

    /* ============================== */
    /* SECTION                        */
    /* ============================== */

    .section {
      margin-top: 28px;
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .section-title {
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-size: 1.05rem;
      margin: 0;
    }

    .section-title span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-top: 2px;
    }

    /* ============================== */
    /* GRID                           */
    /* ============================== */

    .grid {
      display: grid;
      gap: 9px;
    }

    /* ============================== */
    /* CARD                           */
    /* ============================== */

    .card {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 8px;

      border: 1px solid var(--line);

      background: var(--panel);

      border-radius: 12px;

      overflow: hidden;

      transition:
        border-color .2s ease,
        transform .2s ease,
        background .2s ease;
    }

    .card:hover {
      border-color: #3a444f;
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    /* ============================== */
    /* THUMBNAIL                      */
    /* ============================== */

    .thumb-link {
      flex: 0 0 132px;
    }

    .thumb-wrap {
      position: relative;

      width: 132px;
      aspect-ratio: 16 / 9;

      background: #0a0c0f;

      border-radius: 8px;

      overflow: hidden;

      border: 1px solid #1d232a;
    }

    .thumb {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .play {
      position: absolute;

      right: 6px;
      bottom: 6px;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: rgba(0,0,0,.72);

      border:
        1px solid rgba(255,255,255,.16);

      font-size: .72rem;
    }

    /* ============================== */
    /* CONTENT                        */
    /* ============================== */

    .content {
      min-width: 0;

      flex: 1;

      padding:
        2px
        4px
        2px
        0;
    }

    .title {
      margin: 0;

      font-size: .95rem;

      line-height: 1.35;

      font-weight: 650;

      word-break: break-word;
    }

    .watch {
      display: block;

      margin-top: 5px;

      color: var(--muted);

      font-size: .73rem;
    }

    /* ============================== */
    /* FILE / LINK ICON               */
    /* ============================== */

    .asset-icon {
      flex:
        0 0 132px;

      width: 132px;

      aspect-ratio: 16 / 9;

      border-radius: 8px;

      display: grid;
      place-items: center;

      background: #0a0c0f;

      color: #c8d0d8;

      font-size: .8rem;

      font-weight: 700;

      letter-spacing: .06em;

      border:
        1px solid #1d232a;
    }

    .external {
      margin-left: auto;

      color: var(--muted);

      font-size: .9rem;

      padding-right: 4px;
    }

    /* ============================== */
    /* DISABLED                       */
    /* ============================== */

    .disabled-card {
      opacity: .5;
    }

    /* ============================== */
    /* LOADING / ERROR                */
    /* ============================== */

    .loading,
    .error,
    .empty {
      padding: 20px;

      border:
        1px solid var(--line);

      background: var(--panel);

      border-radius: 12px;

      color: var(--muted);

      text-align: center;
    }

    .error strong {
      display: block;

      color: var(--text);

      margin-bottom: 6px;
    }

    /* ============================== */
    /* FOOTER                         */
    /* ============================== */

    footer {
      margin-top: 30px;

      text-align: center;

      color: var(--muted);

      font-size: .72rem;
    }

    /* ============================== */
    /* NOSCRIPT                       */
    /* ============================== */

    .js-warning {
      position: fixed;

      inset: 0;

      z-index: 99999;

      display: grid;

      place-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #151a20 0,
          #0b0d10 45%,
          #080a0d 100%
        );
    }

    .js-warning-box {
      width: min(430px, 100%);

      padding: 28px;

      text-align: center;

      background: var(--panel);

      border:
        1px solid var(--line);

      border-radius: 18px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.35);
    }

    .js-warning-icon {
      font-size: 42px;

      margin-bottom: 12px;
    }

    .js-warning-box h2 {
      margin-bottom: 10px;

      font-size: 1.2rem;
    }

    .js-warning-box p {
      margin: 8px 0;

      color: var(--muted);

      font-size: .85rem;

      line-height: 1.6;
    }

    .js-buttons {
      display: flex;

      gap: 8px;

      justify-content: center;

      flex-wrap: wrap;

      margin-top: 18px;
    }

    .js-button {
      appearance: none;

      border: 0;

      border-radius: 9px;

      padding: 10px 16px;

      background: var(--white);

      color: #111;

      font-weight: 700;

      cursor: pointer;

      font-size: .82rem;
    }

    .js-button.secondary {
      background: #1d232a;

      color: var(--text);

      border:
        1px solid var(--line);
    }

    /* ============================== */
    /* MOBILE                         */
    /* ============================== */

    @media (max-width: 520px) {

      .container {
        width:
          min(
            100% - 14px,
            900px
          );

        padding-top: 16px;
      }

      .thumb-link {
        flex-basis: 112px;
      }

      .thumb-wrap,
      .asset-icon {
        width: 112px;
      }

      .title {
        font-size: .88rem;
      }

      .watch {
        font-size: .7rem;
      }

      .section {
        margin-top: 24px;
      }
    }
  </style>
</head>


<body>

  <!-- ================================= -->
  <!-- JAVASCRIPT MATI                   -->
  <!-- ================================= -->

  <noscript>

    <div class="js-warning">

      <div class="js-warning-box">

        <div class="js-warning-icon">
          ⚠️
        </div>

        <h2>
          JavaScript Tidak Aktif
        </h2>

        <p>
          Dokumentasi utama membutuhkan
          JavaScript untuk membaca data arsip.
        </p>

        <p>
          Aktifkan JavaScript pada pengaturan
          browser, kemudian muat ulang halaman.
        </p>

        <div class="js-buttons">

          <button
            class="js-button"
            type="button"
            onclick="location.reload()"
          >
            ↻ Muat Ulang
          </button>

          <button
            class="js-button secondary"
            type="button"
            onclick="alert(
              'JavaScript tidak dapat dinyalakan otomatis oleh halaman web.\\n\\n' +
              'Buka pengaturan browser dan aktifkan JavaScript untuk situs ini, lalu kembali ke halaman dan tekan Muat Ulang.'
            )"
          >
            ⚙ Nyalakan JavaScript
          </button>

        </div>

      </div>

    </div>

  </noscript>


  <!-- ================================= -->
  <!-- KONTEN                           -->
  <!-- ================================= -->

  <main class="container">

    <header>

      <h1>
        Dokumentasi Utama Ahmad Rijani
      </h1>

      <div class="subtitle">
        Dokumentasi, video, dan berkas PKL
      </div>

    </header>


    <!-- ================================= -->
    <!-- DOKUMENTASI UTAMA                 -->
    <!-- ================================= -->

    <section
      class="section"
      id="dokumentasiSection"
    >

      <div class="section-title">

        <h2>
          📁 Dokumentasi Utama
        </h2>

        <span>
          Seluruh dokumentasi yang tersedia
        </span>

      </div>


      <div
        class="grid"
        id="dokumentasiGrid"
      >

        <div class="loading">
          Memuat dokumentasi…
        </div>

      </div>

    </section>


    <footer>
      Arsip PKL Ahmad Rijani
    </footer>

  </main>



  <script>

    /*
     * ==========================================
     * SUMBER DATA
     * ==========================================
     *
     * Sistem mencoba sumber secara berurutan.
     *
     * 1. /file/arsip.json
     * 2. ./file/arsip.json
     * 3. GitHub Raw
     *
     * Jika sumber pertama gagal,
     * otomatis mencoba sumber berikutnya.
     */

    const SUMBER_ARSIP = [

      "/file/arsip.json",

      "./file/arsip.json",

      "https://raw.githubusercontent.com/Ahmadrijani/pkl/refs/heads/main/file/arsip.json"

    ];


    const dokumentasiGrid =
      document.getElementById(
        "dokumentasiGrid"
      );



    /*
     * ==========================================
     * ESCAPE HTML
     * ==========================================
     */

    function escapeHTML(nilai) {

      return String(nilai ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }



    /*
     * ==========================================
     * BUAT VIDEO
     * ==========================================
     */

    function createVideo(item) {

      const link =
        item.href ||
        `https://www.youtube.com/watch?v=${encodeURIComponent(item.id)}`;


      const judul =
        item.title ||
        item.manualTitle ||
        "Tanpa judul";


      /*
       * Video belum tersedia
       */

      if (item.disabled) {

        return `

          <article
            class="card disabled-card"
          >

            <div class="asset-icon">
              —
            </div>


            <div class="content">

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Link belum tersedia
              </span>

            </div>

          </article>

        `;

      }


      /*
       * Video normal
       */

      return `

        <article class="card">

          <a
            class="thumb-link"
            href="${link}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >

            <div class="thumb-wrap">

              <img
                class="thumb"
                src="https://img.youtube.com/vi/${encodeURIComponent(item.id)}/hqdefault.jpg"
                alt=""
                loading="lazy"
                onerror="
                  this.style.display='none';
                "
              >

              <span class="play">
                ▶
              </span>

            </div>

          </a>


          <div class="content">

            <a
              href="${link}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Tonton di YouTube ↗
              </span>

            </a>

          </div>

        </article>

      `;

    }



    /*
     * ==========================================
     * BUAT FILE / LINK
     * ==========================================
     */

    function createFileOrLink(item) {

      const icon =
        item.icon ||
        "LINK";


      const judul =
        item.title ||
        "Tanpa judul";


      /*
       * Item disabled
       */

      if (item.disabled) {

        return `

          <article
            class="card disabled-card"
          >

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>


            <div class="content">

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

            </div>

          </article>

        `;

      }


      /*
       * Item normal
       */

      return `

        <article class="card">

          <a
            class="thumb-link"
            href="${item.href}"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="${escapeHTML(judul)}"
          >

            <div class="asset-icon">
              ${escapeHTML(icon)}
            </div>

          </a>


          <div class="content">

            <a
              href="${item.href}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <h3 class="title">
                ${escapeHTML(judul)}
              </h3>

              <span class="watch">
                Buka dokumentasi ↗
              </span>

            </a>

          </div>


          <span class="external">
            ↗
          </span>

        </article>

      `;

    }



    /*
     * ==========================================
     * AMBIL DATA DARI SEMUA SUMBER
     * ==========================================
     */

    async function ambilArsip() {

      let errorTerakhir = null;


      for (
        const sumber
        of SUMBER_ARSIP
      ) {

        try {

          console.log(
            "Mencoba sumber:",
            sumber
          );


          const response =
            await fetch(
              sumber,
              {
                cache: "no-cache"
              }
            );


          if (!response.ok) {

            throw new Error(
              `HTTP ${response.status}`
            );

          }


          const data =
            await response.json();


          if (
            !Array.isArray(data)
          ) {

            throw new Error(
              "Format arsip.json tidak valid"
            );

          }


          console.log(
            "Arsip berhasil dimuat dari:",
            sumber
          );


          return data;


        } catch (error) {

          console.warn(
            "Sumber gagal:",
            sumber,
            error
          );


          errorTerakhir =
            error;

        }

      }


      throw (
        errorTerakhir ||
        new Error(
          "Semua sumber arsip gagal"
        )
      );

    }



    /*
     * ==========================================
     * RENDER DOKUMENTASI
     * ==========================================
     */

    function renderDokumentasi(items) {

      if (
        !items ||
        items.length === 0
      ) {

        dokumentasiGrid.innerHTML = `

          <div class="empty">
            Belum ada dokumentasi.
          </div>

        `;

        return;

      }


      dokumentasiGrid.innerHTML =
        items
          .map(
            item => {

              if (
                item.type === "video"
              ) {

                return createVideo(
                  item
                );

              }


              return createFileOrLink(
                item
              );

            }
          )
          .join("");

    }



    /*
     * ==========================================
     * ERROR
     * ==========================================
     */

    function tampilkanError(
      error
    ) {

      console.error(
        "Gagal memuat arsip:",
        error
      );


      dokumentasiGrid.innerHTML = `

        <div class="error">

          <strong>
            ⚠️ Gagal memuat dokumentasi
          </strong>

          <div>
            Semua sumber arsip tidak dapat
            diakses.
          </div>

          <div
            style="
              margin-top:8px;
            "
          >
            Silakan periksa koneksi internet
            kemudian coba lagi.
          </div>

          <div
            style="
              margin-top:14px;
            "
          >

            <button
              class="js-button"
              type="button"
              onclick="loadArchive()"
            >
              ↻ Coba Lagi
            </button>

          </div>

        </div>

      `;

    }



    /*
     * ==========================================
     * LOAD UTAMA
     * ==========================================
     */

    async function loadArchive() {

      dokumentasiGrid.innerHTML = `

        <div class="loading">
          Memuat dokumentasi…
        </div>

      `;


      try {

        const items =
          await ambilArsip();


        renderDokumentasi(
          items
        );


      } catch (error) {

        tampilkanError(
          error
        );

      }

    }



    /*
     * ==========================================
     * MULAI
     * ==========================================
     */

    loadArchive();

  </script>

</body>
</html>
