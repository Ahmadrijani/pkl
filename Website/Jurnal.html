
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal PKL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #15191f;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 90%;
    max-width: 360px;
    text-align: center;
}

h2 {
    margin-bottom: 12px;
    font-size: 25px;
}

.deskripsi {
    color: #aab7c4;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

a {
    display: block;
    padding: 16px;
    margin: 12px 0;
    border-radius: 10px;
    background: #252d38;
    border: 1px solid #394756;
    color: #d8efff;
    text-decoration: none;
    font-weight: bold;
    transition: background .2s, border-color .2s;
}

a:hover {
    background: #30485c;
    border-color: #56b9ec;
}

.catatan {
    margin-top: 24px;
    padding: 14px;
    border-radius: 9px;
    background: #202731;
    border: 1px solid #343e49;
    color: #aebdca;
    font-size: 13px;
    line-height: 1.7;
}

.catatan strong {
    color: #d8efff;
}
</style>
</head>

<body>

<div class="container">

    <h2>Jurnal PKL</h2>

    <p class="deskripsi">
        Silakan pilih bagian jurnal yang ingin dibaca.
    </p>

    <a href="https://ahmadrijani.github.io/pkl/file/jurnal/part1.pdf">
        Baca Part 1
    </a>

    <a href="https://ahmadrijani.github.io/pkl/file/jurnal/part2.pdf">
        Baca Part 2
    </a>

    <div class="catatan">
        <strong>Informasi</strong><br>
        Ukuran file cukup besar, jadi tunggu saja hingga dokumen selesai dimuat.
    </div>

</div>

</body>
</html>
